name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    environment:
      name: pypi.org
      url: https://pypi.org/project/${{ github.event.repository.name }}/

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release
        run: |
          npx --yes \
              --package semantic-release@25 \
              --package @semantic-release/exec@7 \
              semantic-release
